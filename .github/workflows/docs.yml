# Docs-only lane (ADR 0009): docs and wiki changes skip the fast lane and only check links.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "wiki/**", "**.md"]
  pull_request:
    paths: ["docs/**", "wiki/**", "**.md"]

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-links.py
