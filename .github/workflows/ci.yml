# Foundation CI for the Untitled Dinosaur Game monorepo (UDG-001).
#
# It runs exactly the local command sequence on a clean checkout with a frozen installation and
# publishes machine-readable results even when a step fails, while every failed required check -
# including evidence capture, evidence verification and artefact publication - fails the run.
# Third-party actions are pinned to immutable commit shas; the ref comment records the tag those shas
# came from, verified through the GitHub git-refs API on 2026-11-08 and recorded in
# docs/integration/dependencies.json.
#
# Owner clarification C-05: this workflow is the CI half of the UDG-001 acceptance evidence. Until
# it has actually run on a pushed commit, UDG-001 stays In Review and the CI reproduction criterion
# is reported as pending, not as passed.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation checks (Node 24.22.2, pnpm 12.18.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The contract suite proves the reviewed prerequisite commit exists in history, so the
          # checkout must not be shallow.
          fetch-depth: 0

      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          corepack pnpm --version
          pnpm --version

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck every populated workspace
        run: pnpm typecheck

      - name: Lint sources and dependency boundaries
        run: pnpm lint

      - name: Run the unit and Node integration suites
        run: pnpm test

      - name: Build shared libraries, tools and apps
        run: pnpm build

      - name: Run positive and negative dependency fixtures
        run: pnpm test:boundaries

      - name: Validate fixture manifests and pinned hashes
        run: pnpm test:fixtures

      - name: Run the UDG-001 task suite
        run: pnpm test:contract -- --task UDG-001

      - name: Verify the contract checksum manifest is in sync
        run: pnpm contracts:checksums

      - name: Verify the committed dependency register
        run: pnpm dependencies:verify

      # Evidence steps are required checks, so they must be able to fail the run. They keep
      # `if: !cancelled()` only so they still execute after an earlier step failed, which is what
      # makes a failing check produce diagnostics instead of a silent skip. No step in this job may
      # set continue-on-error; tests/contracts/UDG-001.test.ts enforces that and executes the
      # artefact assertion below against empty, incomplete and complete bundles.
      - name: Capture the foundation evidence bundle
        if: ${{ !cancelled() }}
        run: pnpm evidence:capture -- --task UDG-001 --out artifacts --keep-going

      - name: Assert the required evidence artefacts exist
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          pointer=artifacts/latest-UDG-001.txt
          if [ ! -s "$pointer" ]; then
            echo "::error::evidence capture wrote no run pointer ($pointer); no evidence exists to verify"
            exit 1
          fi
          run_rel="$(tr -d '\r\n' < "$pointer")"
          # The pointer is repository-relative (artifacts/RUN_ID); normalise to one directory.
          run_dir="${run_rel#artifacts/}"
          echo "evidence run directory: artifacts/$run_dir"
          missing=0
          for required in report.json environment.json commands.json junit.xml boundary-report.json build.log checksums.sha256; do
            if [ ! -s "artifacts/$run_dir/$required" ]; then
              echo "::error::required evidence artefact missing or empty: $required"
              missing=1
            fi
          done
          if [ -z "$(find "artifacts/$run_dir/logs" -type f -size +0 -print -quit 2>/dev/null || true)" ]; then
            echo "::error::no non-empty command log under artifacts/$run_dir/logs"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "all required evidence artefacts present"

      - name: Verify the captured evidence bundle
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          run_rel="$(tr -d '\r\n' < artifacts/latest-UDG-001.txt)"
          pnpm evidence:verify -- --run "$run_rel"
          pnpm evidence:summary -- --run "$run_rel" \
            --out artifacts/UDG-001-ci-summary.json \
            --storage "$run_rel" \
            --ci-status "success (GitHub-hosted ${RUNNER_OS:-Linux}, ${RUNNER_ARCH:-X64})" \
            --ci-url "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # Diagnostics are published after failures (if: !cancelled()) but an absent artefact is itself
      # a failure: a green run must always carry the evidence it claims.
      - name: Publish logs and machine-readable results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: udg-001-evidence
          path: |
            artifacts/latest-UDG-001.txt
            artifacts/UDG-001-*
          if-no-files-found: error
          retention-days: 30
