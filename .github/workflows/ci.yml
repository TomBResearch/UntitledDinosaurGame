# ROUTINE CI for the Untitled Dinosaur Game monorepo — routed checks on pushes and pull requests (C-07).
#
# ## What this workflow is, and what it is not
#
# It runs the checks that the changed files can actually make red, in parallel, and it captures **no evidence**.
# Full evidence capture — all five bundles, the artefact assertion, verification, summaries and publication —
# lives in `acceptance.yml`, which is dispatched explicitly against a named candidate commit. The two lanes are
# named differently on purpose: `ci (routine)` and `ci (acceptance — full evidence capture)` are not the same
# green tick, and a reviewer should never have to open a run to find out which one they are looking at.
#
# Amendment A-P3-8 (approved with C-07) bounds the Phase 3 assignment's "every CI run captures and verifies the
# whole-task bundle" to **every acceptance run**. Inside that job nothing is conditional; here, nothing captures:
# a routine run is not red for a missing bundle, and it can never support a Verified claim.
#
# ## How a change becomes a set of checks
#
# One job (`route`) resolves the changed paths for the whole push or the whole pull request — both sides of a
# rename, deletions included — and asks `tools/ci/route-checks.mjs` which groups they imply. Unknown impact runs
# everything; see the table and the escalation rules in that file, and the suite over it in
# `tests/unit/ci-routing/route-checks.test.ts`. `tests/unit/ci-routing/workflow-policy.test.ts` is what keeps
# this file and that table agreeing in both directions, which is the failure mode a routing scheme has.
#
# ## Failure policy, unchanged
#
# No step in any job sets `continue-on-error`: a check that fails fails the run, and the `routine outcome` job
# is the single name branch protection can require. Diagnostics for a red routine run are in the run log;
# evidence artefacts are published only by an acceptance run, because a routine run has none to publish.

name: ci (routine)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_groups:
        description: 'Comma-separated groups to run regardless of the diff (blank = run them all). For measuring one lane, not for substituting acceptance.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-routine-${{ github.ref }}
  # A superseded push has nothing left to say, and unlike a full capture its work is not evidence.
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.2

jobs:
  # ---------------------------------------------------------------------------------------------
  # The route. Every lane job below is conditioned on one of its outputs, and none of them can run
  # before it has said what the diff implies.
  # ---------------------------------------------------------------------------------------------
  route:
    name: route the changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      records: ${{ steps.route.outputs.records }}
      static: ${{ steps.route.outputs.static }}
      protocol: ${{ steps.route.outputs.protocol }}
      unit: ${{ steps.route.outputs.unit }}
      camera: ${{ steps.route.outputs.camera }}
      server: ${{ steps.route.outputs.server }}
      runtime: ${{ steps.route.outputs.runtime }}
      tooling: ${{ steps.route.outputs.tooling }}
      fullSuite: ${{ steps.route.outputs.fullSuite }}
      groups: ${{ steps.route.outputs.groups }}
      any: ${{ steps.route.outputs.any }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is routed from its merge base, so the base has to be in the object store.
          fetch-depth: 0

      - name: Route
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          FORCE_GROUPS: ${{ inputs.force_groups }}
        run: |
          set -euo pipefail
          args=(--output-file "$GITHUB_OUTPUT")
          case "$EVENT_NAME" in
            push)
              # The union of every commit in the push, not just the tip commit.
              args+=(--base "${PUSH_BEFORE:-}" --head "$GITHUB_SHA")
              ;;
            pull_request)
              # What the PR would change, measured from the merge base — not what its merge commit contains.
              args+=(--base "${PR_BASE:-}" --head "${PR_HEAD:-}" --three-dot)
              ;;
            workflow_dispatch)
              if [ -n "${FORCE_GROUPS:-}" ]; then
                args+=(--force "${FORCE_GROUPS}")
              else
                args+=(--all)
              fi
              ;;
            *)
              args+=(--all)
              ;;
          esac
          echo "router: node tools/ci/route-checks.mjs ${args[*]}"
          node tools/ci/route-checks.mjs "${args[@]}"
          echo "--- this lane runs no evidence capture: bundles come only from a dispatched acceptance run ---"

  # ---------------------------------------------------------------------------------------------
  # The lanes. Each one is a subset of the command sequence the acceptance job runs in full, and each
  # prints its own elapsed time so a lane that outgrows its budget is visible in the log.
  # ---------------------------------------------------------------------------------------------
  records:
    needs: route
    if: ${{ needs.route.outputs.records == 'true' }}
    name: routine / records (docs, contracts and the checksum manifest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # UDG-001's suite proves a cited prerequisite commit exists with `git cat-file`, and a records
          # commit cites shas — so this lane cannot work from a shallow clone.
          fetch-depth: 0
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      # A records commit is not "just prose" here: UDG-001's suite reads adoption.md, README.md, the
      # checksum manifest and both workflow files, and the manifest gate is what catches a records commit
      # that moved an edition-controlled document without regenerating `checksums.json`.
      - name: Verify the contract checksum manifest is in sync
        run: pnpm contracts:checksums
      - name: Build the shared libraries the suites assert against
        run: pnpm build:libraries
      - name: Run the UDG-001 task suite (planning records, pins and CI policy)
        run: pnpm test:contract -- --task UDG-001

      - name: Report the lane duration
        if: ${{ !cancelled() }}
        run: echo "records lane finished on ${{ github.sha }}"

  static:
    needs: route
    if: ${{ needs.route.outputs.static == 'true' }}
    name: routine / static (typecheck, lint and boundaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck every populated workspace
        run: pnpm typecheck
      - name: Lint sources and dependency boundaries
        run: pnpm lint

  protocol:
    needs: route
    if: ${{ needs.route.outputs.protocol == 'true' }}
    name: routine / protocol (protocol contract, fixtures and boundaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build the shared libraries the suites assert against
        run: pnpm build:libraries
      - name: Run the UDG-002 task suite
        run: pnpm test:contract -- --task UDG-002
      - name: Validate fixture manifests and pinned hashes
        run: pnpm test:fixtures
      - name: Run positive and negative dependency fixtures
        run: pnpm test:boundaries

  unit:
    needs: route
    if: ${{ needs.route.outputs.unit == 'true' }}
    name: routine / unit (unit and Node integration suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      # `pnpm test:unit` builds the workspace libraries, but not the checker CLI — and several unit suites
      # import `tools/checks/dist/evidence.js` directly (the Phase 3 case-artefact, capture-refusal, vector and
      # UDG-004 evidence-gate suites all do). A lane that starts from a clean checkout has no dist, so this
      # step is the lane's prerequisite, not a convenience.
      - name: Build the checker CLI the suites import
        run: pnpm --filter @udg/checks build

      # The unit suite launches the pinned chromium itself: `tests/unit/udg-004/evidence-gates.test.ts`
      # proves the PNG portability rules against a real screenshot, so it cannot run without a browser. It
      # does not need the camera suite's artefacts — those belong to the camera and full-suite lanes.
      - name: Install the pinned Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the unit suites
        run: pnpm test:unit

  camera:
    needs: route
    if: ${{ needs.route.outputs.camera == 'true' }}
    name: routine / camera (browser suite and the UDG-004 gate over its artefacts)
    runs-on: ubuntu-24.04
    # A lane's timeout is the wall-clock budget it is allowed to consume, and a cancelled lane fails the
    # outcome just as a failed one does. 20 minutes is this suite plus its gate plus a cold install.
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # The client the suite drives resolves `@udg/protocol` and `@udg/config` through the workspace, so the
      # dev server `playwright.config.ts` starts cannot serve them until they are built. The acceptance job
      # gets this for free from `pnpm typecheck`, which builds the libraries first; a lane that skips it does
      # not fail fast, it hangs in the web-server wait — so the build belongs here, before the suite.
      - name: Build the libraries the dev server resolves
        run: pnpm build:libraries

      # The order is the acceptance job's order, kept: `tests/contracts/UDG-004.test.ts` gates the artefacts
      # the camera suite writes, so a camera run that never happened has to stop this lane rather than be
      # noticed in review.
      - name: Run the UDG-004 camera suite
        env:
          UDG_BROWSER_OUT: artifacts/.routine/camera
        run: pnpm test:e2e -- --suite camera
      - name: Build the shared libraries the suites assert against
        run: pnpm build:libraries
      - name: Run the UDG-004 task suite
        env:
          UDG_BROWSER_OUT: artifacts/.routine/camera
        run: pnpm test:contract -- --task UDG-004

  server:
    needs: route
    if: ${{ needs.route.outputs.server == 'true' }}
    name: routine / server (UDG-003 contract suite and the probe attribution gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build the shared libraries the suites assert against
        run: pnpm build:libraries

      # The invocation is named, and named differently from the acceptance job's two invocations, so a probe
      # artefact can never be attributed to the wrong run: that confusion is what R-7 was written to stop.
      - name: Run the UDG-003 Phase 0 probe suite
        env:
          UDG_PROBE_OUT: artifacts/.routine/probes
          UDG_PROBE_INVOCATION: ci-routine
        run: pnpm test:contract -- --task UDG-003
      - name: Verify probe invocation attribution
        if: ${{ !cancelled() }}
        run: pnpm evidence:probes -- --dir artifacts/.routine/probes

  runtime:
    needs: route
    if: ${{ needs.route.outputs.runtime == 'true' }}
    name: routine / runtime (system suites and the AC-1 reference trace)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      # The whole workspace, not just the libraries: `tests/reference/flat-direct-step.ts` imports
      # `apps/server/dist/authority/step.js`, so the AC-1 trace needs the server emitted, and the system
      # suites drive the same code. This is the acceptance job's prerequisite too — its `pnpm build` step
      # precedes every runtime step there for the same reason.
      - name: Build the workspace the runtime suites execute
        run: pnpm build

      # A server or authority change has to be *executed*, not merely compiled: AC-1's 200-tick reference
      # trace first (it is the movement baseline the numeric claims are read against), then the system suites,
      # whose JUnit counts are printed so "the runtime ran N cases" is a number in the log rather than an
      # inference from a green tick.
      - name: Run the AC-1 reference trace
        run: node tests/reference/flat-direct-step.ts
      - name: Run the system suites
        run: |
          set -euo pipefail
          mkdir -p artifacts/.routine
          pnpm exec vitest run tests/system \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=artifacts/.routine/system-junit.xml
          node -e '
            const fs = require("node:fs");
            const xml = fs.readFileSync("artifacts/.routine/system-junit.xml", "utf8");
            const found = /tests="(\d+)"[^>]*failures="(\d+)"/.exec(xml);
            if (found === null) { console.error("::error::no JUnit summary for tests/system"); process.exit(1); }
            const [, tests, failures] = found;
            console.log(`system suites: ${tests} cases, ${failures} failures`);
            if (Number(tests) === 0) {
              console.error("::error::tests/system discovered zero cases; a zero-test pass is not proof");
              process.exit(1);
            }
          '

  tooling:
    needs: route
    if: ${{ needs.route.outputs.tooling == 'true' }}
    name: routine / tooling (CI policy, pins, register and the capture loop)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build the shared libraries the suites assert against
        run: pnpm build:libraries

      # These are the suites that read `.github/workflows/*` and the capture-loop script under `tools/ci/`. They
      # run on every CI change, and the routing suite is the one that stops the router and the job list drifting
      # apart.
      - name: Run the UDG-001 task suite (CI workflow policy and pins)
        run: pnpm test:contract -- --task UDG-001
      - name: Run the UDG-002 task suite
        run: pnpm test:contract -- --task UDG-002
      - name: Run the CI routing and capture-loop suites
        run: pnpm exec vitest run tests/unit/ci-routing tests/unit/udg-003/capture-loop.test.ts
      - name: Verify the contract checksum manifest is in sync
        run: pnpm contracts:checksums
      - name: Verify the committed dependency register
        run: pnpm dependencies:verify
      - name: Run positive and negative dependency fixtures
        run: pnpm test:boundaries

  full-suite:
    needs: route
    if: ${{ needs.route.outputs.fullSuite == 'true' }}
    name: routine / full suite (pnpm test over the whole suite graph)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned pnpm 12.18.0 through corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # Same reason as the camera lane: `pnpm test` builds the checker and the libraries itself, but the camera
      # step that runs before it needs the libraries already emitted.
      - name: Build the libraries the dev server resolves
        run: pnpm build:libraries
      - name: Run the UDG-004 camera suite
        env:
          UDG_BROWSER_OUT: artifacts/.routine/camera
        run: pnpm test:e2e -- --suite camera
      # `pnpm test` is the command whose JUnit report an acceptance bundle carries, and it is the command that
      # gates the browser artefacts written above. It runs here — without capture — so a change to a shared
      # dependency gets the cross-suite signal inside the routine budget.
      - name: Run the unit and Node integration suites
        env:
          UDG_PROBE_INVOCATION: ci-routine-test
          UDG_BROWSER_OUT: artifacts/.routine/camera
        run: pnpm test

  # ---------------------------------------------------------------------------------------------
  # One name for branch protection to require. It cannot pass when a lane failed, and it cannot pass
  # when nothing was routed at all: a run that checked nothing is not a green run.
  # ---------------------------------------------------------------------------------------------
  outcome:
    name: routine outcome
    needs: [route, records, static, protocol, unit, camera, server, runtime, tooling, full-suite]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Decide the outcome
        env:
          ANY: ${{ needs.route.outputs.any }}
          GROUPS: ${{ needs.route.outputs.groups }}
          REASON: ${{ needs.route.outputs.reason }}
          RESULT_ROUTE: ${{ needs.route.result }}
          RESULT_RECORDS: ${{ needs.records.result }}
          RESULT_STATIC: ${{ needs.static.result }}
          RESULT_PROTOCOL: ${{ needs.protocol.result }}
          RESULT_UNIT: ${{ needs.unit.result }}
          RESULT_CAMERA: ${{ needs.camera.result }}
          RESULT_SERVER: ${{ needs.server.result }}
          RESULT_RUNTIME: ${{ needs.runtime.result }}
          RESULT_TOOLING: ${{ needs.tooling.result }}
          RESULT_FULL_SUITE: ${{ needs.full-suite.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "route: ${GROUPS:-<none>} (reason: ${REASON:-unknown})"
          failed=0
          for pair in \
            "route=${RESULT_ROUTE}" \
            "records=${RESULT_RECORDS}" \
            "static=${RESULT_STATIC}" \
            "protocol=${RESULT_PROTOCOL}" \
            "unit=${RESULT_UNIT}" \
            "camera=${RESULT_CAMERA}" \
            "server=${RESULT_SERVER}" \
            "runtime=${RESULT_RUNTIME}" \
            "tooling=${RESULT_TOOLING}" \
            "full-suite=${RESULT_FULL_SUITE}"; do
            name="${pair%%=*}"
            result="${pair##*=}"
            printf '  %-12s %s\n' "$name" "$result"
            case "$result" in
              failure|cancelled) echo "::error::$name did not pass (${result})"; failed=1 ;;
              *) : ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if [ "${ANY}" != "true" ]; then
            echo "::error::the router selected no group, so nothing was checked; a run that checked nothing cannot be green"
            exit 1
          fi
          echo "routine checks passed for: ${GROUPS}"
          echo "no evidence was captured on this route; milestone acceptance requires a dispatched acceptance run"
